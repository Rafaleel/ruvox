[project]
name = "ruvox-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agno>=3.2.1",
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "platformdirs>=4.14.8",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
